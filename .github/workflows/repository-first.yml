name: Repository-first ranking scan

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/discover-repositories-global.js'
      - 'src/github.js'
      - 'src/global-location-resolver.js'
      - 'src/repository-search.js'
      - 'src/location.js'
      - 'src/output.js'
      - '.github/workflows/repository-first.yml'

permissions:
  contents: write

concurrency:
  group: repository-first
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate project
        run: npm run check

      - name: Advance repository-first scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_SCAN_REQUEST_LIMIT: '300'
          REPOSITORY_SCAN_RUNTIME_MINUTES: '42'
          REPOSITORY_CANDIDATE_LIMIT: '125'
          RATE_LIMIT_RESERVE: '120'
        run: npm run discover:repositories

      - name: Commit scan progress and certified rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/repository-first.json state/repository-candidates/ data/ rankings/ README.md
          if git diff --cached --quiet; then
            echo "No repository-first changes to commit."
            exit 0
          fi
          git commit -m "data: advance repository-first scan"
          git pull --rebase
          git push

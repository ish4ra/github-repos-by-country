name: Sync global geography

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/geography-source.js'
      - 'scripts/sync-geography.js'
      - '.github/workflows/sync-geography.yml'

permissions:
  contents: write

concurrency:
  group: geography-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate before sync
        run: npm run check

      - name: Generate compact geography indexes
        run: npm run sync:geography

      - name: Enrich with GeoNames cities500
        run: python3 scripts/enrich-geography-geonames.py

      - name: Commit geography update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geography/
          if git diff --cached --quiet; then
            echo "No geography changes to commit."
            exit 0
          fi
          git commit -m "data: sync global geography index"
          git pull --rebase
          git push

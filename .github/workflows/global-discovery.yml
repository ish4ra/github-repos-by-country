name: Advance global discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/discover-global-batch.js'
      - 'src/discovery-state.js'
      - 'src/search-shards.js'
      - 'src/github.js'
      - 'src/ranking.js'
      - '.github/workflows/global-discovery.yml'

permissions:
  contents: write

concurrency:
  group: repository-data-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate project
        run: npm run check

      - name: Advance global discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_REQUEST_LIMIT: '180'
          DISCOVERY_PAGE_SIZE: '50'
          DISCOVERY_RUNTIME_MINUTES: '42'
          RATE_LIMIT_RESERVE: '120'
          CANDIDATE_POOL_LIMIT: '500'
        run: npm run discover:global

      - name: Commit discovery progress and completed rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ data/ rankings/
          if git diff --cached --quiet; then
            echo "No discovery changes to commit."
            exit 0
          fi
          git commit -m "data: advance global discovery"
          git pull --rebase
          git push
